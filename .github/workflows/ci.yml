name: CI

# Correctness only, minutes not hours: the unit tests, perft and what the unit tests cover. Strength (EPD tiers, SPRT,
# gauntlets) is measured locally & on OpenBench, see test/smoke.sh. Nothing here is recorded, results are thrown away.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ElephantTest, every target but ElephantSuite, phant-indexer included (ELEPHANT_BUILD_INDEXER, its tests are in
  # ElephantTest), with assertions & exceptions on, the tests check both in an optimized build. Seconds of tests.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DELEPHANT_BUILD_TEST_SUITE=OFF -DASSERTIONS_ENABLED=ON -DEXCEPTIONS_ENABLED=ON -DELEPHANT_BUILD_INDEXER=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} -L unit --output-on-failure

  # ElephantSuite's perft, reference & deep positions (billions of nodes) on every core. The suite's deep searches are
  # left to smoke, they move with the evaluation.
  perft:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel --target ElephantSuite

    - name: Perft
      working-directory: ${{github.workspace}}/build
      # verbose so the node counts & nps show up in the log even when passing.
      run: ctest -C ${{env.BUILD_TYPE}} -L suite -R "^PerftFixture\." --verbose

  # What the unit tests reach: ElephantTest built with gcc's --coverage (ELEPHANT_COVERAGE, Debug, phant-indexer in),
  # gcovr's line, function & branch summary of src/ & indexer/ in the job's summary page. No upload, nothing gates on
  # the numbers. test/coverage.ps1 & test/coverage.sh write the full HTML report locally.
  coverage:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DELEPHANT_COVERAGE=ON -DELEPHANT_BUILD_TEST_SUITE=OFF -DELEPHANT_BUILD_INDEXER=ON -DELEPHANT_BUILD_TUNER=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel --target ElephantTest

    - name: Unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest -L unit -j 4 --output-on-failure

    - name: Coverage summary
      run: |
        pipx install gcovr
        { echo '```'; gcovr --root ${{github.workspace}} --object-directory ${{github.workspace}}/build --exclude '(.*/)?(test|third_party|_deps)/' --exclude-throw-branches --txt --print-summary; echo '```'; } >> $GITHUB_STEP_SUMMARY
