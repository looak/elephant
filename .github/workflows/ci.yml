name: CI

# Correctness only, minutes not hours: the unit tests and perft. Strength (EPD tiers, SPRT, gauntlets) is measured
# locally & on OpenBench, see test/smoke.sh. Nothing here is recorded, results are thrown away.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both builds turn warnings into errors (CMAKE_COMPILE_WARNING_AS_ERROR, -Werror or /WX), our targets are warning free
# and stay so. Third-party targets build with warnings off, see indexer/ & test/CMakeLists.txt.
env:
  BUILD_TYPE: Release

jobs:
  # ElephantTest, every target but ElephantSuite, phant-indexer included (ELEPHANT_BUILD_INDEXER, its tests are in
  # ElephantTest), with assertions & exceptions on, the tests check both in an optimized build. Seconds of tests.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DELEPHANT_BUILD_TEST_SUITE=OFF -DASSERTIONS_ENABLED=ON -DEXCEPTIONS_ENABLED=ON -DELEPHANT_BUILD_INDEXER=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} -L unit --output-on-failure

  # ElephantSuite's perft, reference & deep positions (billions of nodes) on every core. The suite's deep searches are
  # left to smoke, they move with the evaluation.
  perft:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel --target ElephantSuite

    - name: Perft
      working-directory: ${{github.workspace}}/build
      # verbose so the node counts & nps show up in the log even when passing.
      run: ctest -C ${{env.BUILD_TYPE}} -L suite -R "^PerftFixture\." --verbose
