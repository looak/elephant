name: Suite

# Long running perft (ElephantSuite) & the extended EPD tier (test/epd_runner.py), too slow to run on every push.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  suite:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
      with:
        # the whole history, a results run carries its ancestry (test/results.py) to be placed in nyayo's history.
        fetch-depth: 0

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ElephantSuite ElephantGambit

    - name: Results folder
      run: cmake -E make_directory ${{github.workspace}}/logs

    - name: Perft
      working-directory: ${{github.workspace}}/build
      # Verbose so the perft numbers show up in the log even when passing. The EPD suites run through UCI below.
      run: ctest -C ${{env.BUILD_TYPE}} -L suite -E "EpdSuite\." --verbose

    - name: EPD extended tier
      shell: bash
      # every position searched, recorded as a run below, see test/RESULTS.md. The smoke tier is the local subset.
      run: |
        engine="$(find build -type f \( -name ElephantGambit -o -name ElephantGambit.exe \) -not -path "*CMakeFiles*" | head -n 1)"
        py="$(command -v python3 || command -v python)"
        "$py" test/epd_runner.py --engine "$engine" --tier extended --out logs/extended_checks.jsonl --quiet

    - name: Record results
      if: always()
      shell: bash
      run: |
        [ -s logs/extended_checks.jsonl ] || { echo "no results written"; exit 0; }
        py="$(command -v python3 || command -v python)"
        trigger="${{ github.event_name == 'workflow_dispatch' && 'request' || 'push' }}"
        "$py" test/results.py record --checks logs/extended_checks.jsonl --kind extended --trigger "$trigger"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.os }}
        path: logs/results/
        if-no-files-found: ignore
