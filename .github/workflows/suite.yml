name: Suite

# Long running perft & EPD suites (ElephantSuite), too slow to run on every push.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  suite:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ElephantSuite

    - name: Suite
      working-directory: ${{github.workspace}}/build
      # Verbose so the perft numbers and EPD scores show up in the log even when passing
      run: ctest -C ${{env.BUILD_TYPE}} -L suite --verbose
